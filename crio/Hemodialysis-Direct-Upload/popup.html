<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 18px; font: 14px Arial, sans-serif; color: #17212b; }
  h3 { margin: 0 0 14px; font-size: 17px; }
  label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
  input { width: 18px; height: 18px; accent-color: #1478d4; }
  p { color: #5a6470; line-height: 1.45; margin: 12px 0 0; font-size: 12px; }
  #status { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
<h3>CRIO Direct Upload</h3>
<label><input type="checkbox" id="enabled"> Enable direct upload</label>
<div id="status">Loading...</div>
<p>ON: Files number opens Add New Subject Document with Other / Other and Hemodialysis Records (when available).</p>
<p>OFF: Normal CRIO Files popup.</p>
<script src="popup.js"></script>
</body>
</html>
