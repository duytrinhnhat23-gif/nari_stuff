<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rave Medication Filler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="header">
      <div class="badge">M</div>
      <div>
        <h1>Medication Filler</h1>
        <p>Medidata Rave</p>
      </div>
    </div>

    <label for="rawData">Medication data</label>
    <textarea id="rawData" spellcheck="false"
      placeholder="Medication | Dose | Dose Unit | Route | Frequency | Start Date | End Date/Ongoing | Indication | Identifier&#10;&#10;Epogen | 7000 | IU | IV | TIW | 24-Jan-2026 | 06-Mar-2026 | Medical History | 007"></textarea>

    <div class="row-controls">
      <div class="field">
        <label for="rowNumber">Row to fill</label>
        <input id="rowNumber" type="number" min="1" value="1">
      </div>
      <div class="row-nav">
        <button id="prevBtn" class="secondary" title="Previous row">←</button>
        <button id="nextBtn" class="secondary" title="Next row">→</button>
      </div>
    </div>

    <div id="preview" class="preview">No medication selected.</div>

    <div class="actions">
      <button id="fillBtn" class="primary">Fill Page</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <div class="hint"><b>F3</b> fills the selected row on the current page.</div>
    <div id="status" class="status"></div>
  </main>

  <script src="fillMedicationPage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
